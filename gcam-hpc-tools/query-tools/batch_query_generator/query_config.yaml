# GCAM batch query builder config
#
# How to use:
# 1. Copy region names from available_regions into selected_regions.
# 2. Copy query titles from available_queries into selected_queries.
# 3. Run: python batch_query_generator.py query_config.yaml
#
# Use All to select every available region or query.

selected_regions:
  - All

selected_queries:
  - iron and steel production by region
  - iron and steel production by tech

# Leave blank to write ../user_batch_queries/output_queries_<timestamp>.xml
# Or set a fixed path, for example: ../user_batch_queries/output_queries_custom.xml
output_file:

# Query XML files to read. Paths are relative to this config file.
query_files:
  - queries_xml/Main_queries.xml
  - queries_xml/shrwt_query.xml

# Available regions. Do not edit unless adding new supported regions.
available_regions:
